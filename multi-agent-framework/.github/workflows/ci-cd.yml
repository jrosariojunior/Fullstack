name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

jobs:
  # ===== LINT & CODE QUALITY =====
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort pylint mypy

      - name: Check code formatting with black
        run: black --check backend/

      - name: Check import sorting with isort
        run: isort --check-only backend/

      - name: Lint with flake8
        run: |
          # E501 = line too long (handled by black)
          # W503 = line break before binary operator
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Type checking with mypy
        run: mypy backend/ --ignore-missing-imports || true

  # ===== UNIT TESTS =====
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: multi_agent_user
          POSTGRES_PASSWORD: multi_agent_pass
          POSTGRES_DB: multi_agent_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          DATABASE_URL=postgresql+asyncpg://multi_agent_user:multi_agent_pass@localhost:5432/multi_agent_db
          REDIS_URL=redis://localhost:6379/0
          CLAUDE_API_KEY=sk-ant-test-key
          OPENAI_API_KEY=sk-test-key
          LLM_PROVIDER=claude
          EOF

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U multi_agent_user; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --cov=backend --cov-report=xml --cov-report=html --cov-fail-under=70 || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: htmlcov/

  # ===== SECURITY SCAN =====
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Security scan with bandit
        run: |
          bandit -r backend/ -ll || true

      - name: Check for vulnerable dependencies
        run: |
          safety check || true

  # ===== BUILD DOCKER IMAGE =====
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===== DEPLOY TO STAGING =====
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging environment
        run: |
          echo "🚀 Deploying to staging environment..."
          # TODO: Add your staging deployment logic
          # Examples:
          # - Deploy to Heroku, Railway, or similar
          # - Deploy to Kubernetes staging cluster
          # - Deploy to AWS/GCP/Azure staging environment
          echo "✅ Staging deployment complete"

      - name: Run smoke tests on staging
        run: |
          echo "🧪 Running smoke tests on staging..."
          # TODO: Add smoke tests against staging environment
          echo "✅ Smoke tests passed"

  # ===== DEPLOY TO PRODUCTION =====
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment status
        run: |
          echo "🚀 Deploying to production..."
          # TODO: Add your production deployment logic
          # Examples:
          # - Deploy to production Kubernetes cluster
          # - Deploy to AWS/GCP/Azure production environment
          # - Rolling updates or blue-green deployment
          echo "✅ Production deployment complete"

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          # TODO: Add health check against production endpoint
          # curl -f https://api.example.com/health || exit 1
          echo "✅ Health checks passed"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Production deployment successful"
          # TODO: Add notification to Slack, PagerDuty, etc.

  # ===== NOTIFY RESULTS =====
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ] || \
             [ "${{ needs.build.result }}" == "failure" ]; then
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
          else
            echo "status=✅ PASSED" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack (optional)
        if: always()
        run: |
          echo "Pipeline Status: ${{ steps.status.outputs.status }}"
          # TODO: Add Slack notification webhook
          # curl -X POST $SLACK_WEBHOOK_URL -d ...
